name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: |
          for f in index.js rest-server.js mcp-server.js lib/*.js; do
            node -c "$f"
          done
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          node -e "
            const fs = require('fs');
            const total = require('./coverage/coverage-summary.json').total;
            const pct = total.lines.pct;
            const color = pct >= 90 ? 'brightgreen' : pct >= 75 ? 'green' : pct >= 50 ? 'yellow' : 'red';
            fs.mkdirSync('badges', { recursive: true });
            fs.writeFileSync('badges/coverage.json', JSON.stringify({
              schemaVersion: 1,
              label: 'coverage',
              message: pct + '%',
              color
            }, null, 2));
          "

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
